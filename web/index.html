<!doctype html>
<html lang="en" data-build="{{build}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}} {{subtitle}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#242629">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23242629'/%3E%3Cg transform='scale(1.3333333)'%3E%3Crect x='3' y='3' width='5' height='5' rx='0.8' fill='%23fff'/%3E%3Crect x='9.5' y='3' width='5' height='5' rx='0.8' fill='%23fff'/%3E%3Crect x='16' y='3' width='5' height='5' rx='0.8' fill='%23fff'/%3E%3Crect x='3' y='9.5' width='5' height='5' rx='0.8' fill='%23fff'/%3E%3Crect x='9.5' y='9.5' width='5' height='5' rx='0.8' fill='%23fff'/%3E%3Crect x='16' y='9.5' width='5' height='5' rx='0.8' fill='%23fff'/%3E%3Crect x='3' y='16' width='5' height='5' rx='0.8' fill='%23fff'/%3E%3Crect x='9.5' y='16' width='5' height='5' rx='0.8' fill='%23fff'/%3E%3Crect x='16' y='16' width='5' height='5' rx='0.8' fill='%23fff'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/"><strong>{{title}}</strong> <span>{{subtitle}}</span></a>
    <nav aria-label="Main">
      <div class="zoom" role="group" aria-label="Zoom" hidden>
        <svg class="zoom-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l5.5 5.5"/></svg>
        <span class="zoom-track">
          <input type="range" id="zoom-range" min="50" max="200" step="1" value="100" aria-label="Zoom level">
          <span class="tick min" aria-hidden="true"></span>
          <span class="tick default" aria-hidden="true"></span>
          <span class="tick max" aria-hidden="true"></span>
        </span>
      </div>
      <div class="modes" role="group" aria-label="Layout" hidden>
        <button type="button" data-mode="grid" aria-pressed="true" aria-label="Square grid" title="Square grid">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="5" height="5" rx="0.8"/><rect x="9.5" y="3" width="5" height="5" rx="0.8"/><rect x="16" y="3" width="5" height="5" rx="0.8"/><rect x="3" y="9.5" width="5" height="5" rx="0.8"/><rect x="9.5" y="9.5" width="5" height="5" rx="0.8"/><rect x="16" y="9.5" width="5" height="5" rx="0.8"/><rect x="3" y="16" width="5" height="5" rx="0.8"/><rect x="9.5" y="16" width="5" height="5" rx="0.8"/><rect x="16" y="16" width="5" height="5" rx="0.8"/>
          </svg>
        </button>
        <button type="button" data-mode="fit" aria-pressed="false" aria-label="Original proportions" title="Original proportions">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="6" height="10" rx="0.8"/><rect x="3" y="14.5" width="6" height="6.5" rx="0.8"/>
            <rect x="10.5" y="3" width="5.5" height="5" rx="0.8"/><rect x="10.5" y="9.5" width="5.5" height="11.5" rx="0.8"/>
            <rect x="17.5" y="3" width="3.5" height="9.5" rx="0.8"/><rect x="17.5" y="14" width="3.5" height="7" rx="0.8"/>
          </svg>
        </button>
      </div>
      <div class="nav-break" aria-hidden="true"></div>
      <a href="#/" data-tab="photos">Photos</a>
      <a href="#/albums" data-tab="albums">Albums</a>
      <button type="button" id="about-open" hidden>About</button>
    </nav>
  </header>

  <main id="view"></main>
  <noscript><p class="notice">This site needs JavaScript to show the photos.</p></noscript>

  <footer id="foot"></footer>

  <!-- Photo viewer -->
  <dialog id="lightbox" aria-label="Photo viewer">
    <div class="lb-top">
      <span id="lb-count" aria-live="polite"></span>
      <button type="button" class="icon" id="lb-close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="lb-stage" id="lb-stage" tabindex="-1" autofocus>
      <img id="lb-img" alt="">
      <button type="button" class="icon nav prev" id="lb-prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button type="button" class="icon nav next" id="lb-next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="lb-info">
      <p class="where" id="lb-where"></p>
      <p class="exif" id="lb-exif"></p>
    </div>
  </dialog>

  <!-- About drawer -->
  <dialog id="about" aria-label="About">
    <div class="drawer">
      <button type="button" class="icon" id="about-close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="about-body"></div>
    </div>
  </dialog>
</body>
</html>
